<script>
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const NUM=/-?\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)|-?\d+,\d{2}(?!\d)/g;try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
const P=s=>parseFloat(s.replace(/\./g,"").replace(",","."));
const E=n=>n==null||isNaN(n)?"–":n.toLocaleString("it-IT",{style:"currency",currency:"EUR"});

try{slips=JSON.parse(localStorage.getItem("slips")||"[]")}catch(e){}

function mkRows(its){
  its.sort((a,b)=>b.y-a.y||a.x-b.x);const R=[];let row=null;
  its.forEach(i=>{if(!row||Math.abs(row.y-i.y)>2){row={y:i.y,it:[]};R.push(row)}row.it.push(i)});
  R.forEach(r=>{r.it.sort((a,b)=>a.x-b.x);r.t=r.it.map(i=>i.s).join(" ").replace(/\s+/g," ").trim()});
  return R;
}
function splitW(its){const o=[];its.forEach(i=>{const s=i.s;if(!/\s/.test(s.trim())){o.push(Object.assign({},i,{s:s.trim()}));return}
  const cw=(i.r-i.x)/Math.max(1,s.length),re=/\S+/g;let m;while((m=re.exec(s)))o.push({s:m[0],x:i.x+m.index*cw,r:i.x+(m.index+m[0].length)*cw,y:i.y})});return o}
async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let R=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    R=R.concat(mkRows(splitW(tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],r:i.transform[4]+i.width,y:i.transform[5]})))));
  }

}
function findAmt(L,re){for(const l of L)if(re.test(l)){const a=l.match(NUM);if(a)return P(a[a.length-1])}return null}

  let t,c;R.forEach(r=>r.it.forEach(i=>{const s=i.s.trim();if(s=="TRATTENUTE"&&!t)t=i;if(s=="COMPETENZE"&&!c)c=i}));
  const V=[],T=[];if(!t||!c)return{V,T};
  const a=(t.x+t.r)/2,b=(c.x+c.r)/2,lo=a-(b-a)/2,mid=(a+b)/2;let on=false;
  R.forEach(r=>{
    if(r.it.some(i=>i.s.trim()=="TRATTENUTE")&&r.it.some(i=>i.s.trim()=="COMPETENZE")){on=true;return}
    if(/^conguaglio/i.test(r.t)){on=false;return}
    if(!on||/totale|netto/i.test(r.t))return;
    let cv=null,tv=null;
    r.it.forEach((i,n)=>{const m=i.s.match(NUM);if(!m||/[()]/.test(i.s)||/\($/.test(n?r.it[n-1].s.trim():""))return;
      const v=P(m[m.length-1]);if(i.r>mid)cv=v;else if(i.r>lo)tv=v});
    if(cv==null&&tv==null)return;
    const f=r.it.findIndex(i=>isNum(i.s));

    <div class="lh">PIN dimenticato?</div><div class="lm" style="margin-top:10px">Il PIN non si può recuperare. Per reimpostarlo devi cancellare tutti i dati dell'app da questo telefono. Se hai un file di backup potrai ripristinarlo subito dopo.</div>
    <div style="margin-top:auto;width:100%;max-width:340px"><button class="btn r" onclick="forgotGo()">Cancella dati e reimposta</button><button class="btn s" style="margin-top:10px" onclick="lk.mode='unlock';lk.v='';drawL()">Annulla</button></div></div>`;return}
  const[tt,sub]=LKT[lk.mode],lo=locked(),can=lk.mode!="unlock",bio=lk.mode=="unlock"&&sec&&sec.bio;
  let msg=lk.msg||sub;if(lo){msg=`Troppi tentativi. Riprova tra ${Math.ceil((fail.until-Date.now())/1000)} s`;lkT=setTimeout(drawL,1000)}
  const key=d=>`<button ${lo?"disabled":""} onclick="lkKey('${d}')">${d}</button>`;
  const bioIco='<svg viewBox="0 0 24 24"><path d="M5 9V7a2 2 0 0 1 2-2h2M15 5h2a2 2 0 0 1 2 2v2M19 15v2a2 2 0 0 1-2 2h-2M9 19H7a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 10v3.5h-1M9.5 16a3.5 3.5 0 0 0 5 0"/></svg>';
  el.innerHTML=`<div class="lock"><div class="lt">${can?`<button onclick="lkCancel()">Annulla</button>`:""}</div>
  <div class="lav"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>
  <div class="lh">${tt}</div><div class="lm ${lk.err||lo?"e":""}">${msg}</div>
  <div class="dots ${lk.st}">${[0,1,2,3,4,5].map(i=>`<i class="${i<lk.v.length?"on":""}"></i>`).join("")}</div>
  <div class="kp">${["1","2","3","4","5","6","7","8","9"].map(key).join("")}
  ${bio?`<button ${lo?"disabled":""} onclick="tryBio()" aria-label="Accesso biometrico">${bioIco}</button>`:`<button class="nb" tabindex="-1"></button>`}${key("0")}
  <button onclick="lkDel()" aria-label="Cancella"><svg viewBox="0 0 24 24"><path d="M9 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button></div>
  ${lk.mode=="unlock"?`<button class="lf" onclick="lk.mode='forgot';drawL()">PIN dimenticato?</button>`:`<div class="lf"></div>`}</div>`}
function lkDel(){if(!lk||lk.busy)return;lk.v=lk.v.slice(0,-1);lk.st="";drawL()}
function lkKey(d){if(!lk||lk.busy||locked()||lk.v.length>=6)return;lk.v+=d;lk.st="";if(lk.v.length<6){drawL();return}lk.busy=true;drawL();setTimeout(lkDone,140)}
function lkBad(m){lk.st="bad shk";lk.err=true;lk.msg=m;drawL();setTimeout(()=>{if(!lk)return;lk.v="";lk.st="";lk.busy=false;drawL()},480)}
async function lkDone(){
  const v=lk.v;
  if(lk.mode=="set1"){lk.tmp=v;lk.mode="set2";lk.v="";lk.msg="";lk.err=false;lk.busy=false;drawL();return}
  if(lk.mode=="set2"){
    if(v!=lk.tmp){lk.mode="set1";lk.tmp=null;lkBad("I PIN non coincidono. Riprova");return}
    const salt=hex(rnd(16)),h=await hashPin(v,salt),was=!!sec;
    sec={h,salt,bio:was&&sec.bio?sec.bio:null};saveSec();fail={n:0,until:0};saveFail();
    lk.st="ok";drawL();setTimeout(()=>{lk=null;drawL();drawO();toast(was?"PIN aggiornato":"PIN attivato")},300);return}
  const h=await hashPin(v,sec.salt,sec.h[0]=="f"&&sec.h.length<40);
  if(h==sec.h){fail={n:0,until:0};saveFail();lk.st="ok";drawL();const nx=lk.next;setTimeout(()=>{lk=null;drawL();drawO();if(nx)nx()},260);return}
  fail.n++;const left=5-fail.n%5;
  if(fail.n%5==0){fail.until=Date.now()+30000*Math.min(8,fail.n/5)}
  saveFail();lkBad(fail.n%5==0?"PIN errato":`PIN errato. ${left} ${left==1?"tentativo rimasto":"tentativi rimasti"}`);
}
function lkCancel(){lk=null;drawL();drawO()}
async function tryBio(){
  if(!lk||lk.mode!="unlock"||!sec||!sec.bio||locked()||lk.bb)return;lk.bb=true;
  try{if(await bioCheck()&&lk){fail={n:0,until:0};saveFail();lk.v="••••••";lk.st="ok";drawL();setTimeout(()=>{lk=null;drawL();drawO()},260)}}
  catch(e){if(lk){lk.msg="Tocca l'icona in basso a sinistra per riprovare, o usa il PIN";lk.err=false;drawL()}}
  finally{if(lk)lk.bb=false}
}
function forgotGo(){slips=[];save();sec=null;saveSec();fail={n:0,until:0};saveFail();lk=null;sel=null;tab="ov";drawL();draw();toast("Dati cancellati. Crea un nuovo PIN da Sicurezza")}
function secOpen(){mo=false;ss=true;bioA=null;drawO();bioAvail().then(t=>{bioA=t||"no";if(ss)drawO()})}
function secSheet(){
  const on=!!sec,bo=!!(sec&&sec.bio),bn=bioA=="no",chev='<span class="chev"></span>';
  const bsub=!on?"Attiva prima il PIN":bioA==null?"Controllo del dispositivo…":bn&&!bo?"Non disponibile su questo dispositivo":"Sblocca con impronta o riconoscimento del volto";
  return`<div class="sheet"><div class="sh2"><button onclick="closeUI()">Chiudi</button><b>Sicurezza</b><span style="min-width:78px"></span></div>
  <div class="sl">
  <div class="ps"><h1>Accesso</h1><div class="card" style="padding:4px 18px">
  <div class="op" onclick="secPin()"><span><b>Blocco con PIN</b><small>${on?"Attivo · PIN di 6 cifre":"Richiede un PIN all'apertura"}</small></span><span class="sw ${on?"on":""}"></span></div>
  ${on?`<div class="op" onclick="secChange()"><span><b>Cambia PIN</b><small>Serve il PIN attuale</small></span>${chev}</div>`:""}
  <div class="op ${on&&!(bn&&!bo)?"":"na"}" onclick="secBio()"><span><b>Accesso biometrico</b><small>${bsub}</small></span><span class="sw ${bo?"on":""}"></span></div>
  ${on?`<div class="op" onclick="closeUI();setTimeout(lockNow,250)"><span><b>Blocca ora</b><small>L'app si blocca anche dopo 1 minuto in background</small></span>${chev}</div>`:""}
  </div></div>
  <div class="mu" style="margin:14px 8px">Il PIN impedisce di aprire l'app su questo telefono. I dati delle buste non vengono cifrati: tieni attivo anche il blocco schermo del telefono. Se dimentichi il PIN, l'unico modo per reimpostarlo è cancellare i dati dell'app, quindi fai un backup.</div>
  </div></div>`}
function secPin(){if(!sec)startLock("set1");else startLock("verify",()=>{sec=null;saveSec();drawO();toast("PIN disattivato")})}
function secChange(){if(sec)startLock("verify",()=>startLock("set1"))}
async function secBio(){
  if(!sec){toast("Attiva prima il PIN");return}
  if(sec.bio){sec.bio=null;saveSec();drawO();toast("Accesso biometrico disattivato");return}
  if(bioA=="no"){toast("Biometria non disponibile su questo dispositivo");return}
  try{const b=await bioEnroll();sec.bio=b;saveSec();drawO();toast("Accesso biometrico attivato")}
  catch(e){const n=String(e&&(e.name+" "+e.message));toast(/na\b|NotSupported|Security/i.test(n)?"Biometria non disponibile qui":"Attivazione annullata")}
}
let hidAt=0;
if(document.addEventListener){
  document.addEventListener("visibilitychange",()=>{if(document.hidden)hidAt=Date.now();else{if(sec&&!lk&&hidAt&&Date.now()-hidAt>60000)lockNow();hidAt=0}});
  document.addEventListener("keydown",e=>{if(!lk||lk.mode=="forgot")return;if(/^[0-9]$/.test(e.key))lkKey(e.key);else if(e.key=="Backspace")lkDel();else if(e.key=="Escape"&&lk.mode!="unlock")lkCancel()});
}
function tip(e){e.stopPropagation();const el=e.currentTarget,w=el.closest(".cw"),d=w.querySelector(".tip"),b=el.getBoundingClientRect(),r=w.getBoundingClientRect();
  document.querySelectorAll(".tip").forEach(x=>x.style.display="none");d.textContent=el.dataset.t;d.style.display="block";
  d.style.left=Math.max(60,Math.min(r.width-60,b.left+b.width/2-r.left))+"px";d.style.top=(b.top-r.top-6)+"px"}
if(document.addEventListener)document.addEventListener("click",()=>document.querySelectorAll(".tip").forEach(d=>d.style.display="none"));
let tx=0,ty=0;
/* ---------- Tasto indietro ---------- */
let ex=false,guard=false;
const NAPP=()=>{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.App||null};
function drawX(){const el=document.getElementById("ex");if(!el)return;
  el.innerHTML=ex?`<div class="alrt" onclick="if(event.target==this){ex=false;drawX()}"><div><b>Uscire da Cedolino?</b><p>I tuoi dati restano salvati su questo telefono.</p><div class="ab"><button onclick="ex=false;drawX()">Annulla</button><button onclick="exitGo()">Esci</button></div></div></div>`:""}
function goBack(){
  if(ex){ex=false;drawX();return}
  if(lk){if(lk.mode=="forgot"){lk.mode="unlock";lk.v="";drawL();return}if(lk.mode!="unlock"){lkCancel();return}ex=true;drawX();return}
  if(dm||em||bm||ss){dm=false;em=false;bm=false;ss=false;drawO();return}
  if(mo){mo=false;drawO();return}
  if(pk){pk=false;draw();return}
  if(tab!="ov"){tab="ov";draw();return}
  ex=true;drawX();
}
function exitGo(){ex=false;drawX();const A=NAPP();if(A&&A.exitApp){A.exitApp();return}
  try{if(guard){guard=false;history.go(-2)}}catch(e){}setTimeout(()=>{try{window.close()}catch(e){}},300)}
(function(){
  const A=NAPP();
  if(A&&A.addListener){try{A.addListener("backButton",()=>goBack());return}catch(e){}}
  try{if(window.self===window.top&&history.pushState&&window.addEventListener){
    history.replaceState({g:0},"");history.pushState({g:1},"");guard=true;
    window.addEventListener("popstate",()=>{if(!guard)return;goBack();if(guard)try{history.pushState({g:1},"")}catch(e){}})}}catch(e){}
})();
if(document.addEventListener){document.addEventListener("pointerup",rel);document.addEventListener("pointercancel",rel)}
if(document.addEventListener){document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});document.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(tab=="home"&&Math.abs(dx)>70&&Math.abs(dy)<45&&!(e.target.closest&&e.target.closest(".chips,input")))go(dx<0?1:-1)},{passive:true})}
function draw(){
  document.getElementById("m").innerHTML=`<div class="title"><button class="ham" onclick="menu()" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span>${TT[tab]}</span>${tab!="up"?`<button class="addb" onclick="tab='up';draw()" aria-label="Carica buste paga"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Carica</button>`:""}</div><div class="${an}">`+(tab=="ov"?overview():tab=="home"?home():tab=="year"?annual():load())+"</div>";an="";
  document.getElementById("n").innerHTML=NAV.map(([k,t])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';draw()"><svg viewBox="0 0 24 24">${IC[k]}</svg>${t}</button>`).join("");
  drawO();
  if(lt!=tab){try{scrollTo(0,0)}catch(e){}lt=tab}
  try{const st=document.getElementById("strip"),on=st&&st.querySelector(".on");if(on)st.scrollLeft=on.offsetLeft-st.clientWidth/2+on.offsetWidth/2}catch(e){}
}
draw();
try{if("serviceWorker" in navigator&&location.protocol=="https:")navigator.serviceWorker.register("sw.js")}catch(e){}
if(sec)startLock("unlock");
</script>
