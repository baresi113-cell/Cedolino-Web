/* ===== Movimento e grafica ===== */
:root{--sp:cubic-bezier(.2,.9,.25,1);--sh:0 1px 2px rgba(0,0,0,.04),0 10px 26px -14px rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 0 0 .5px rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--sh:0 0 0 .5px rgba(255,255,255,.06)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:300px;background:radial-gradient(120% 100% at 50% -30%,var(--tint),transparent 70%);pointer-events:none;z-index:0}
main{position:relative;z-index:1;padding-bottom:124px}
.card{box-shadow:var(--sh)}
.rv{opacity:0;transform:translate3d(var(--dx,0px),18px,0)}
.rv.in{opacity:1;transform:none;transition:opacity .55s var(--sp),transform .65s var(--sp);transition-delay:var(--d,0ms)}
button,.chip,.item,.di,.op,.mi,.pt{transition:transform .18s var(--sp),opacity .18s,background .2s,color .2s}
button:active{opacity:.75;transform:scale(.96)}
.item:active,.di:active,.op:active,.mi:active{transform:scale(.985);opacity:.8}
.kp button:active{transform:scale(.9)}
/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#0a84ff 0%,#5e5ce6 60%,#7d4be8 100%)}
.hero::before{content:"";position:absolute;inset:-60%;z-index:-1;background:radial-gradient(closest-side at 32% 34%,rgba(255,255,255,.3),transparent 62%),radial-gradient(closest-side at 72% 66%,rgba(255,55,160,.38),transparent 60%),radial-gradient(closest-side at 62% 24%,rgba(60,220,255,.32),transparent 58%);animation:blob 16s ease-in-out infinite alternate;will-change:transform}
@keyframes blob{0%{transform:translate3d(-6%,-4%,0) rotate(0deg) scale(1)}50%{transform:translate3d(5%,6%,0) rotate(40deg) scale(1.12)}100%{transform:translate3d(-3%,8%,0) rotate(80deg) scale(1)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 38%);border-radius:inherit}
.eye{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spk{position:absolute;left:0;right:0;bottom:0;width:100%;height:62px;opacity:.55;pointer-events:none;z-index:-1}
.hb{height:7px;border-radius:9px;background:rgba(255,255,255,.26);margin-top:14px;overflow:hidden}.hb i{display:block;height:100%;border-radius:9px;background:#fff}
.rv.in .hb i,.re .hb i{animation:wd .9s var(--sp) both;animation-delay:.15s}@keyframes wd{from{width:0}}
/* grafici */
.ln{stroke-dasharray:1;stroke-dashoffset:0}.rv:not(.in) .ln{stroke-dashoffset:1}
.rv.in .ln,.re .ln{animation:dr 1.1s var(--sp) both;animation-delay:calc(var(--d,0ms) + var(--k,0) * 120ms)}@keyframes dr{from{stroke-dashoffset:1}}
.rv.in .ar,.re .ar{animation:fi .9s ease both;animation-delay:.45s}@keyframes fi{from{opacity:0}}
.dt{transform-box:fill-box;transform-origin:center}
.rv.in .dt,.re .dt{animation:pp .5s var(--sp) both;animation-delay:calc(.25s + var(--i,0) * 45ms)}@keyframes pp{from{transform:scale(0);opacity:0}}
.bars div,.sc{transform-origin:50% 100%;background:linear-gradient(180deg,var(--ac),var(--ac2))}.sc{background:none}
.rv.in .bars div,.re .bars div,.rv.in .sc,.re .sc{animation:gr .7s var(--sp) both;animation-delay:calc(.1s + var(--i,0) * 38ms)}@keyframes gr{from{transform:scaleY(0)}}
.ring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4.2;stroke-linecap:round}.ring .tr{stroke:var(--fill)}
.rv.in .ring .pr,.re .ring .pr{animation:rg 1.1s var(--sp) both;animation-delay:.2s}@keyframes rg{from{stroke-dasharray:0 100}}
.rcd{display:flex;align-items:center;justify-content:space-between;gap:6px}.rcd .k{white-space:nowrap}

const SKi=(id,e)=>(e?"slipsE":"slips")+(id=="p0"?"":":"+id);
const hasE=()=>{try{return localStorage.getItem(SKi(pid,1))!=null}catch(e){return false}};
/* cifratura dei dati con il PIN */
let dk=null,dkRaw=null,svQ=Promise.resolve();const BSRV="it.cedolino.app";
const subtle=()=>{try{return crypto.subtle||null}catch(e){return null}};
const b64u=u=>{let t="";for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};

async function decAll(){let ok=true;for(const p of profs){try{const c=localStorage.getItem(SKi(p.id,1));if(c!=null){localStorage.setItem(SKi(p.id,0),await decS(c));localStorage.removeItem(SKi(p.id,1))}}catch(e){ok=false}}return ok}

  if(dk){const txt=JSON.stringify(slips);svQ=svQ.then(()=>encS(txt)).then(c=>{try{localStorage.setItem(SKi(id,1),c);localStorage.removeItem(SKi(id,0))}catch(e){}}).catch(()=>{});return}
  try{if(localStorage.getItem(SKi(id,1))!=null)return;localStorage.setItem(SKi(id,0),JSON.stringify(slips))}catch(e){}};

function mkRows(its){
  its.sort((a,b)=>b.y-a.y||a.x-b.x);const R=[];let row=null;
  its.forEach(i=>{if(!row||Math.abs(row.y-i.y)>2){row={y:i.y,it:[]};R.push(row)}row.it.push(i)});
  R.forEach(r=>{r.it.sort((a,b)=>a.x-b.x);r.t=r.it.map(i=>i.s).join(" ").replace(/\s+/g," ").trim()});

}
function splitW(its){const o=[];its.forEach(i=>{const s=i.s;if(!/\s/.test(s.trim())){o.push(Object.assign({},i,{s:s.trim()}));return}
  const cw=(i.r-i.x)/Math.max(1,s.length),re=/\S+/g;let m;while((m=re.exec(s)))o.push({s:m[0],x:i.x+m.index*cw,r:i.x+(m.index+m[0].length)*cw,y:i.y})});return o}
async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let R=[];

    R=R.concat(mkRows(splitW(tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],r:i.transform[4]+i.width,y:i.transform[5]})))));

}
function findAmt(L,re){for(const l of L)if(re.test(l)){const a=l.match(NUM);if(a)return P(a[a.length-1])}return null}

const CODE=/^(?:[A-Z]{1,2}\d{3,5}|\d{6}|ZP[A-Z0-9]{4})/;
const isNum=s=>/^-?[\d.]+,\d+[)%]?$/.test(s.trim());
function columns(R){
  let t,c;R.forEach(r=>r.it.forEach(i=>{const s=i.s.trim();if(s=="TRATTENUTE"&&!t)t=i;if(s=="COMPETENZE"&&!c)c=i}));
  const V=[],T=[];if(!t||!c)return{V,T};
  const a=(t.x+t.r)/2,b=(c.x+c.r)/2,lo=a-(b-a)/2,mid=(a+b)/2;let on=false;

    if(r.it.some(i=>i.s.trim()=="TRATTENUTE")&&r.it.some(i=>i.s.trim()=="COMPETENZE")){on=true;return}

    if(cv==null&&tv==null)return;

    const NB=/^-?[\d.]+,\d+/,nm=r.it.filter(i=>NB.test(i.s.trim())&&!/[()]/.test(i.s)&&i.r<=lo).map(i=>P(i.s.trim().match(NB)[0]));

function countUp(el){
  const v=+el.dataset.cu,f=el.dataset.f;if(!isFinite(v)||priv||RM())return;

function reveal(w,dir){

  if(!w||RM()||typeof IntersectionObserver=="undefined")return;
